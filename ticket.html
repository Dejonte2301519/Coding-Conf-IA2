<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Ticket | Coding Conf</title>
    <link rel="icon" type="image/png"
          href="../favicon-32x32.png">
    <link rel="stylesheet" href="../style.css">
    <script src="../ticket.js" defer></script>
</head>
<body>
    <!-- Background decorative patterns -->
    <div class="background-decoration" aria-hidden="true"></div>
    <!-- Header -->
    <header class="site-header">
        <a class="brand" href="index.html">
            <img src="../logo-full.svg"
                 alt="Coding Conf">
        </a>
    </header>
    <!-- Main ticket content -->
    <main class="ticket-main">
        <section class="ticket-heading">
            <h1 id="confirmationName">
                Congrats! Your ticket is ready.
            </h1>
            <p>
                We've emailed your ticket to
                <strong id="confirmationEmail">your email</strong>
                 see you soon!
            </p>
        </section>
        <!-- Event ticket -->
        <section class="ticket-wrap">
            <article class="event-ticket">
                <!-- Main ticket information -->
                <div class="ticket-main-content">
                    <div class="ticket-topline">
                        <img
                            src="../logo-full.svg"
                            alt="Coding Conf"
                            class="ticket-logo">
                        <span class="ticket-id" id="ticketId">
                            #01609
                        </span>
                    </div>
                    <p class="ticket-date">
                        October 26, 2026
                        <span>·</span>
                        Papine, Kingston
                    </p>
                    <!-- Attendee details -->
                    <div class="attendee-row">
                        <img
                            src="../image-avatar.jpg"
                            alt="Attendee avatar"
                            id="attendeeAvatar"
                            class="attendee-avatar">
                        <div class="attendee-details">
                            <h2 id="attendeeName">
                                Attendee Name
                            </h2>
                            <a
                                id="githubLink"
                                href="https://github.com/"
                                target="_blank"
                                rel="noopener noreferrer">
                                <img
                                    src="../icon-github.svg"
                                    alt="GitHub icon">
                                <span id="attendeeGithub">
                                    @githubuser
                                </span>
                            </a>
                        </div>
                    </div>
                </div>
                <!-- Ticket stub -->
                <div class="ticket-stub">
                    <span>CODING CONF</span>
                    <strong id="stubTicketId">
                        #01609
                    </strong>
                    <div class="stub-code">
                        &lt;/&gt;
                    </div>
                </div>
            </article>
        </section>
        <p class="ticket-note">
            Keep your ticket safe and present it when you arrive.
        </p>
        <a class="primary-button" href="index.html">
            Return to Home
        </a>
    </main>
    <!-- Footer -->
    <footer class="site-footer">
        <p>Coding Conf 2026 · D. Maxwell</p>
    </footer>
</body>
</html>
